; Buddy's eyes: copy this file to eyes.ini and fill it in.
[eyes]
; Your first name, so Buddy knows who's at the desk.
owner_name = Eric
; Which webcam (0 = the first one; try 1 if it picks the wrong camera).
camera_index = 0
; Ollama on this PC, and the models to use.
ollama_url = http://localhost:11434
vision_model = qwen2.5vl:7b
chat_model = qwen3:4b-instruct
; Home Assistant's MQTT broker (the Mosquitto add-on) and a login, like Buddy's.
mqtt_host = 192.168.4.97
mqtt_port = 1883
mqtt_user =
mqtt_password =
; How often to look (seconds) while you're at the desk, and roughly how often
; to make a remark (minutes; someone new showing up gets one right away).
look_every_seconds = 60
remark_every_minutes = 30
; Out of every 100 remarks, about how many are his own thoughts (something he's
; wondering about, a daydream, a plan for the day) instead of what he sees.
thoughts_percent = 40
; No watching or remarks between these times.
quiet_hours_from = 23:00
quiet_hours_to = 07:00
