; Desk companion firmware for the M5Stack CoreS3.
; Build & flash:  pio run -t upload    Serial log:  pio device monitor

[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
